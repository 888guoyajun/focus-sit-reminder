<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注提醒器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark">●</span><span>专注提醒器</span></div>
      <div class="window-actions"><button id="minimize" title="最小化">—</button><button id="close" title="退出">×</button></div>
    </header>

    <section class="status-row"><span id="statusDot" class="status-dot"></span><span id="statusText">正在专注</span><span id="todayCount" class="today-count">今日 0 次起身</span></section>

    <section id="timerPanel" class="timer-panel">
      <div class="eyebrow">下一次提醒</div>
      <div id="timer" class="timer">45:00</div>
      <div id="timerHint" class="timer-hint">专注进行中，保持这个节奏</div>
    </section>

    <section id="alertPanel" class="alert-panel hidden">
      <div class="alert-icon">!</div>
      <div><div id="alertTitle" class="alert-title">该活动一下了</div><div id="alertMessage" class="alert-message">坐了有一阵，起来走两分钟吧。</div></div>
    </section>

    <div class="actions">
      <button id="respond" class="primary"><span>✓</span> 我起来了</button>
      <button id="snooze" class="secondary"><span>◷</span> 稍后提醒</button>
    </div>

    <section class="controls">
      <button id="pause" class="control"><span id="pauseIcon">Ⅱ</span><span id="pauseText">暂停提醒</span></button>
      <button id="mute" class="control"><span id="muteIcon">♩</span><span id="muteText">静音</span></button>
      <button id="settings" class="control"><span>⚙</span><span>设置</span></button>
    </section>

    <section id="settingsPanel" class="settings hidden">
      <div class="setting-line"><label for="focusMinutes">专注提醒</label><div><input id="focusMinutes" type="number" min="1" max="180"> 分钟</div></div>
      <div class="setting-line"><label for="sitMinutes">久坐提醒</label><div><input id="sitMinutes" type="number" min="1" max="180"> 分钟</div></div>
      <label class="demo-toggle"><input id="demoMode" type="checkbox"> 开发测试模式（10 秒触发）</label>
      <button id="saveSettings" class="save">保存设置</button>
    </section>
    <footer><span id="level">提醒级别 1 / 3</span><span>本地运行 · 不上传数据</span></footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
